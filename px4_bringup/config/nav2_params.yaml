# ============================================================
#  Nav2 Parameters — PX4 x500 Drone (2D fixed-altitude nav)
#  Robot: holonomic (can strafe in any direction)
#  Speed: 1.0 m/s max
#  Radius: 0.3 m
# ============================================================

# ── bt_navigator ────────────────────────────────────────────
# The behaviour tree navigator. Orchestrates the whole
# navigation action — calls planner, then controller,
# monitors progress, handles failures.
bt_navigator:
  ros__parameters:
    use_sim_time: true
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    bt_loop_duration: 10
    default_server_timeout: 60      # increased from 20 — gives nodes more time
    wait_for_service_timeout: 1000
    action_server_result_timeout: 900.0
    transform_tolerance: 0.5
    navigators: ["navigate_to_pose", "navigate_through_poses"]
    navigate_to_pose:
      plugin: "nav2_bt_navigator::NavigateToPoseNavigator"
    navigate_through_poses:
      plugin: "nav2_bt_navigator::NavigateThroughPosesNavigator"
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code

# ── planner_server ───────────────────────────────────────────
# Computes a global path from current pose to goal on the map.
# NavFn uses A* on the global costmap.
planner_server:
  ros__parameters:
    use_sim_time: true
    expected_planner_frequency: 1.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.3
      use_astar: true
      allow_unknown: true

# ── controller_server ────────────────────────────────────────
# Runs the local planner (DWB) at 10Hz.
# Holonomic drone — enable x, y, and theta velocity.
controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 10.0
    costmap_update_timeout: 0.30
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    transform_tolerance: 0.5
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    cmd_vel_topic: /cmd_vel_nav_raw

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.05
      movement_time_allowance: 30.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.3
      yaw_goal_tolerance: 0.5
      stateful: true

    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      
      # Holonomic trajectory generator — this is what was missing before
      trajectory_generator_name: "dwb_plugins::StandardTrajectoryGenerator"
      
      min_vel_x: -0.5
      max_vel_x:  1.0
      min_vel_y: -0.5
      max_vel_y:  0.5
      max_vel_theta: 0.8
      min_speed_xy: 0.0
      max_speed_xy: 1.0
      min_speed_theta: 0.0

      acc_lim_x: 1.0
      acc_lim_y: 1.0
      acc_lim_theta: 1.0
      decel_lim_x: -1.0
      decel_lim_y: -1.0
      decel_lim_theta: -1.0

      vx_samples: 20
      vy_samples: 10
      vtheta_samples: 20

      sim_time: 1.5
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.5
      xy_goal_tolerance: 0.3
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true

      critics: [
        "Oscillation",
        "BaseObstacle",
        "GoalAlign",
        "PathAlign",
        "PathDist",
        "GoalDist"
      ]
      BaseObstacle.scale: 0.02
      PathAlign.scale: 24.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
# ── smoother_server ──────────────────────────────────────────
# Smooths the global path after planning.
smoother_server:
  ros__parameters:
    use_sim_time: true
    smoother_plugins: ["simple_smoother"]
    simple_smoother:
      plugin: "nav2_smoother::SimpleSmoother"
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

# ── behavior_server ──────────────────────────────────────────
# Recovery behaviours when stuck.
behavior_server:
  ros__parameters:
    use_sim_time: true
    local_costmap_topic: local_costmap/costmap_raw
    global_costmap_topic: global_costmap/costmap_raw
    local_footprint_topic: local_costmap/published_footprint
    global_footprint_topic: global_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.8
    min_rotational_vel: 0.2
    rotational_acc_lim: 1.5

# ── waypoint_follower ────────────────────────────────────────
waypoint_follower:
  ros__parameters:
    use_sim_time: true
    loop_rate: 5
    stop_on_failure: false
    action_server_result_timeout: 900.0
    waypoint_task_executor_plugin: "wait_at_waypoint"
    wait_at_waypoint:
      plugin: "nav2_waypoint_follower::WaitAtWaypoint"
      enabled: true
      waypoint_pause_duration: 0

# ── velocity_smoother ────────────────────────────────────────
# OPEN_LOOP — doesn't need real velocity from /odom.
velocity_smoother:
  ros__parameters:
    use_sim_time: true
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    cmd_vel_in_topic:  /cmd_vel_nav_raw
    cmd_vel_out_topic: /cmd_vel_nav
    max_velocity:    [ 1.0,  0.5,  1.0]
    min_velocity:    [-0.5, -0.5, -1.0]
    max_accel:       [ 1.5,  1.5,  1.5]
    max_decel:       [-1.5, -1.5, -1.5]
    odom_topic: /odom
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

# ── global_costmap ───────────────────────────────────────────
# Full map-sized grid used by the planner.
# static_layer: loads SLAM map as fixed obstacles.
# obstacle_layer: adds live lidar detections.
# inflation_layer: expands obstacles by robot_radius.
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 2.0
      publish_frequency: 2.0
      resolution: 0.05
      track_unknown_space: true
      robot_radius: 0.3
      always_send_full_costmap: true
      transform_tolerance: 0.5
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]

      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_fixed
          data_type: "LaserScan"
          clearing: true
          marking: true
          obstacle_min_range: 0.2
          obstacle_max_range: 28.0
          raytrace_min_range: 0.2
          raytrace_max_range: 29.0
          inf_is_valid: true
          max_obstacle_height:  100.0
          min_obstacle_height: -100.0
          sensor_frame: lidar_link

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 1.2
        cost_scaling_factor: 2.0

# ── local_costmap ────────────────────────────────────────────
# Small rolling window around the drone used by DWB.
# No static layer — only live sensor data.
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      width: 6
      height: 6
      resolution: 0.05
      update_frequency: 10.0
      publish_frequency: 5.0
      transform_tolerance: 0.5
      robot_radius: 0.3
      always_send_full_costmap: true
      plugins: ["obstacle_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan_fixed
          data_type: "LaserScan"
          clearing: true
          marking: true
          obstacle_min_range: 0.2
          obstacle_max_range: 28.0
          raytrace_min_range: 0.2
          raytrace_max_range: 29.0
          inf_is_valid: true
          sensor_frame: lidar_link
          max_obstacle_height:  100.0
          min_obstacle_height: -100.0

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 1.2
        cost_scaling_factor: 2.0

# ── map_server ───────────────────────────────────────────────
# Not managed by lifecycle — SLAM Toolbox publishes /map.
map_server:
  ros__parameters:
    use_sim_time: true
    yaml_filename: ""

map_saver:
  ros__parameters:
    use_sim_time: true
    save_map_timeout: 5.0
    free_thresh_default: 0.25
    occupied_thresh_default: 0.65
    map_subscribe_transient_local: true

# ── lifecycle_manager ────────────────────────────────────────
# bond_timeout increased to handle slow map/costmap loading.
# attempt_respawn_reconnection retries if a node is slow.
lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: true
    autostart: true
    bond_timeout: 10.0
    attempt_respawn_reconnection: true
    node_names:
      - controller_server
      - smoother_server
      - planner_server
      - behavior_server
      - bt_navigator
      - waypoint_follower
      - velocity_smoother